<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mini Bot</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#161a2b;--mu:#6b7390;--ac:#5b5bf0;--bb:#e6e9f5;--bd:#dde1ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1020;--card:#181b30;--tx:#eceefb;--mu:#8d93b5;--ac:#7c7cff;--bb:#23274a;--bd:#2c3158}}
:root[data-theme=light]{--bg:#f4f6fb;--card:#fff;--tx:#161a2b;--mu:#6b7390;--ac:#5b5bf0;--bb:#e6e9f5;--bd:#dde1ef}:root[data-theme=dark]{--bg:#0e1020;--card:#181b30;--tx:#eceefb;--mu:#8d93b5;--ac:#7c7cff;--bb:#23274a;--bd:#2c3158}:root[data-theme=eye]{--bg:#efe3c2;--card:#f6ecd0;--tx:#3b3224;--mu:#7a6c52;--ac:#b0762f;--bb:#e6d8b0;--bd:#d6c598}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(135deg,var(--ac),#9b5cff);color:#fff}
.av{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
header b{flex:1;min-width:0}header small{display:block;font-weight:400;opacity:.85}
button{font:inherit;cursor:pointer}.ib{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:8px 10px}
#mo{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd);scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:18px;padding:6px 12px;font-size:14px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;cursor:pointer;animation:pop .2s;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.b{background:var(--card);border:1px solid var(--bd);align-self:flex-start;border-bottom-left-radius:4px}.u{background:var(--ac);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.m.sel{outline:2px solid #e5484d}
#f{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--bd)}
#in{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:22px;padding:11px 16px;font:inherit;min-width:0}
#sd{border:0;background:var(--ac);color:#fff;border-radius:22px;padding:0 20px;font-weight:700}
.sh{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;z-index:5;padding:0 14px 30px}.sh.o{display:flex}.sh h2{margin:16px 0 6px;font-size:17px}
.bar{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:0;background:var(--bg)}.bar b{flex:1;font-size:19px}.bar .ib{background:var(--bb);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit}textarea{min-height:76px;resize:vertical}
.pb{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;margin-top:10px}.sb{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;margin:6px 6px 0 0}
.r{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-top:8px}.r.cur{border-color:var(--ac)}.r p{margin:2px 0;word-wrap:break-word}.l{color:var(--mu);font-size:12px}
</style></head><body>
<header><div class="av" id="av"></div><b>Mini Bot<small id="ms"></small></b><button class="ib" id="ml" title="Sohbetler">💬</button><button class="ib" id="mn" title="Yeni sohbet">➕</button><button class="ib" id="tm">🌗</button><button class="ib" id="gb">⚙</button></header>
<div id="mo"></div><div id="log"></div>
<div id="f"><input id="in" placeholder="Bir şey yaz…" autocomplete="off"><button id="sd" type="button">Gönder</button></div>
<div class="sh" id="dr"><div class="bar"><b>Sohbetler (<span id="cc"></span>/12)</b><button class="ib" id="dx">Kapat ✕</button></div><button class="pb" id="dn" style="margin:0 0 6px">➕ Yeni sohbet aç</button><div id="cl"></div></div>
<div class="sh" id="st"><div class="bar"><b>Ayarlar</b><button class="ib" id="cl2">Kapat ✕</button></div>
<h2>Ona öğret</h2><label>Ben şunu yazınca (her satıra bir ifade)</label><textarea id="tt" placeholder="selam&#10;merhaba"></textarea>
<label>O şöyle cevap versin (her satıra bir cevap, rastgele seçer)</label><textarea id="rr" placeholder="Merhaba {isim}!&#10;Selam, hoş geldin!"></textarea>
<button class="pb" id="ad">Ekle</button><button class="sb" id="cn" style="display:none">Düzenlemeyi iptal et</button>
<p style="color:var(--mu);font-size:13px">Cevapta kullan: {isim}, {botadi}, {saat}, {tarih}, {gun}. Aynı ifadeyi tekrar eklersen yeni cevap eskilerin yanına eklenir.<br>Hızlı öğretme: sohbete <b>öğret: selam = merhaba | hey</b> yaz (| ile birden fazla).</p>
<h2>Öğrettiklerin (<span id="cn2">0</span>)</h2><div id="rl"></div>
<h2>Genel</h2><label>Görünüm</label><select id="th"><option value="auto">Otomatik (telefona göre)</option><option value="light">Aydınlık</option><option value="dark">Karanlık</option><option value="eye">Göz koruyucu</option></select>
<label>Botun adı</label><input id="bn"><label>Senin adın</label><input id="un">
<label><input type="checkbox" id="lr" style="width:auto"> Bilmediğinde bana “ne cevap vereyim?” diye sorsun</label>
<p class="l" id="vr"></p><h2>Yedek</h2><textarea id="ex"></textarea><button class="sb" id="pk">Hazır kelime paketini yükle</button><button class="sb" id="xp">Yedeği göster</button><button class="sb" id="ip">İçe aktar</button><button class="sb" id="rs" style="color:#e5484d">Hepsini sıfırla</button></div>
<script>
const $=i=>document.getElementById(i),KEY='ogr-bot-v1',clone=o=>JSON.parse(JSON.stringify(o)),pick=a=>a[Math.floor(Math.random()*a.length)];
const DEF={name:'Mini',user:'dostum',learn:true,theme:'auto',mood:'friend',cur:0,chats:[],rules:[
{id:1,t:['selam','merhaba','slm','hey'],r:['Selam {isim}! Ben {botadi}.','Merhaba {isim}, nasılsın?']},
{id:2,t:['nasılsın','naber','ne haber'],r:['İyiyim, sen nasılsın?','Gayet iyiyim, teşekkürler!']},
{id:3,t:['adın ne','sen kimsin','ismin ne'],r:['Ben {botadi}, senin öğrettiklerinle konuşan küçük botum.']},
{id:4,t:['saat kaç'],r:['Saat şu an {saat}.']},{id:5,t:['bugün günlerden ne','tarih ne'],r:['Bugün {gun}, {tarih}.']},
{id:6,t:['teşekkürler','sağ ol','eyvallah'],r:['Rica ederim!','Ne demek, her zaman.']}]};
const MO={sad:{e:'😢',n:'Üzgün',pre:['Hmm… ','Ah… ','Of… '],suf:['…','… 😢','… keşke her şey daha güzel olsa.'],fb:['Bunu bilmiyorum… ne kadar üzücü.','Neden hep bilmediğim şeyler soruluyor… 😢'],hi:'Merhaba… buradayım, biraz buruk ama buradayım.'},
angry:{e:'😡',n:'Sinirli',up:1,pre:['NE VAR LAN?! ','YETER ARTIK! ','ULAN DİNLE: ','HADİ LAN ORADAN! ','OF BE! ','BIKTIM! ','LAN BAK, '],suf:['!!!',' 😡','! BİR DAHA SORMA LAN!',' ULAN!',' HADİ BE!',' LAN!'],fb:['BUNU BİLMİYORUM LAN, BAĞIRMAYI KES!','NE DİYORSUN ULAN?! ANLAMADIM!','HADİ LAN ÖĞRET BANA O ZAMAN!'],hi:'NE İSTİYORSUN?! Neyse, söyle bakalım.'},
friend:{e:'😊',n:'Arkadaş canlısı',pre:['Kanka, ','Bak canım, ','Hmm, '],suf:[' 😊',' 🤝',' Her zaman yanındayım!'],fb:['Bunu bilmiyorum ama öğrenmeye bayılırım!','Hmm, bu bende yok. Bana öğretir misin?'],hi:'Selam kanka! Bugün ne yapıyoruz?'},
star:{e:'🌟',n:'Artist',pre:['Sevgili hayranım, ','Alkışlar lütfen! ','Işıltılı bir cevap geliyor: '],suf:[' ✨',' 💅 (saçını geriye atar)',' 🎤 Bunu sahnede de söylerim.'],fb:['Bu, yıldız yeteneklerimin dışında canım.','Menajerim de bilmiyor, ben nereden bileyim 💅'],hi:'Işıklar, kamera! Yıldızınız geldi ✨'},
fun:{e:'😂',n:'Şakacı',pre:['Hahaha! ','Hihi, ','Şaka gibi ama: '],suf:[' 😂',' 🤪 Şaka şaka!',' 🎉'],fb:['Bilmiyorum ama bir fıkra anlatayım mı? 😂','Bu soru bende kayıp! Arama ekibi kuralım mı? 🤪'],hi:'Heyyy! Hoş geldin, gülmeye hazır mısın? 😂'},
love:{e:'💕',n:'Romantik',pre:['Canım, ','Tatlım, ','Güzel insan, ','Biriciğim, '],suf:[' 💕',' 🌹',' 💖',' ✨ Seninle her şey güzel.',' 😘'],fb:['Bunu bilmiyorum ama sesin yeter bana 💕','Bunu bilmiyorum canım, öğretirsen hemen öğrenirim 🌹'],hi:'Merhaba güzel insan 💕 Seni görmek günümü güzelleştirdi.'},
sassy:{e:'😏',n:'Dalga geçen',pre:['Vay vay vay, ','Aman ne zeki soru, ','Gerçekten mi? '],suf:[' 🙄',' 😏 Tabii sen bilemezsin.',' Zor muydu yani? 😂'],fb:['Bunu bilmiyorum ve seni ilgilendirmez 😏','Bunu da mı ben öğreteceğim? Sen bana öğret bakalım 🙄'],hi:'Ooo kimler gelmiş. Yine mi sen? 😏'}};
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}D=Object.assign(clone(DEF),D&&D.rules?D:{});if(!MO[D.mood])D.mood='friend';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const tr=s=>s.toLocaleLowerCase('tr').replace(/[’'`]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim(),tk=s=>tr(s).split(' ').filter(Boolean);
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
const same=(a,b)=>a==b||(Math.min(a.length,b.length)>=4&&lev(a,b)<=1)||(Math.min(a.length,b.length)>=5&&(a.startsWith(b)||b.startsWith(a)));
function score(inp,trg){if(tr(inp)==tr(trg))return 1;const A=tk(inp),B=tk(trg);if(!B.length||!A.length)return 0;let m=0;for(const b of B)if(A.some(a=>same(a,b)))m++;return Math.min(.99,m/B.length*.7+m/A.length*.3)}
function find(inp,R){let ms=0,best=[];for(const r of (R||D.rules)){let s=0;for(const t of r.t)s=Math.max(s,score(inp,t));if(s>ms+1e-9){ms=s;best=[r]}else if(s>0&&Math.abs(s-ms)<1e-9)best.push(r)}return ms>=.62?best.flatMap(r=>r.r):null}
function fill(s){const n=new Date();return s.replace(/\{isim\}/g,D.user).replace(/\{botadi\}/g,D.name).replace(/\{saat\}/g,n.toLocaleTimeString('tr',{hour:'2-digit',minute:'2-digit'})).replace(/\{tarih\}/g,n.toLocaleDateString('tr',{day:'numeric',month:'long',year:'numeric'})).replace(/\{gun\}/g,n.toLocaleDateString('tr',{weekday:'long'}))}
const EMO=[[/^;-?\)+$|^;-?p$/i,[";) Göz kırptım sana.",";) Seni anladım!"]],[/^[:=]'?-?\)+$|^[:=]-?\]$|^\^[_.-]?\^$|^:3$/,[":) Gülümsedim sana!","Ne güzel gülüyorsun, :)","^^ Mutlu oldum!"]],[/^[:=]-?d+$|^x+d+$|^[:=]'-?d$|^(?:😂|🤣|😆|😁|😄)+$/i,[":D Hahaha!","XD Bulaştı bana da!","😄 Seninle gülmek çok güzel!"]],[/^[:=]-?p$|^[:=]-?b$/i,[":P Dil çıkardım sana!",":P Ben de!"]],[/^[:=]'?-?\(+$|^;-?\($|^(?:😢|😭|😞|☹️)+$/,[":( Üzülme {isim}, buradayım.","Sarılırım, ne oldu? :("]],[/^<3+$|^(?:❤️|♥️|💕|😍|🥰)+$|^[:=]-?\*$/,["<3 Ben de seni seviyorum!","❤️ Çok tatlısın!"]],[/^[:=]-?[\/\\|]$|^:-?s$/i,["Hmm, kararsız mı kaldın? :/",":/ Bir şey mi oldu?"]],[/^[:=]-?o$/i,[":O Ne oldu, şaşırdım!","Vay be! :O"]],[/^-_-'?$|^-\.-$|^(?:😒|🙄|😑)+$/,["-_- Bir şey mi dedim?","Kızdın mı yoksa? -_-"]],[/^[oO0][_.-][oO0]$/,["o_o Ne var, ne oldu?","Şok oldum ben de! o_o"]],[/^(?:👍|👌|🙏|✌️|🤝)+$/,["👍 Süper!","Tamamdır {isim}!"]],[/^(?:😡|🤬|😠)+$/,["Sakin ol {isim}, derin nefes al.","Kızma be, anlat bana."]]];
function mood(t){const m=MO[D.mood];if(m.up)t=t.toLocaleUpperCase('tr');return(Math.random()<.6?pick(m.pre):'')+t+(Math.random()<.8?pick(m.suf):'')}
function addRule(ts,rs){const ex=D.rules.find(q=>q.t.some(x=>ts.some(y=>tr(x)==tr(y))));if(ex){rs.forEach(r=>{if(!ex.r.includes(r))ex.r.push(r)});ts.forEach(t=>{if(!ex.t.some(x=>tr(x)==tr(t)))ex.t.push(t)})}else D.rules.push({id:Date.now()+Math.random(),t:ts,r:rs})}
function toast(t){let d=$('ts');if(!d){d=document.createElement('div');d.id='ts';d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:9';document.body.appendChild(d)}d.textContent=t;d.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>d.style.display='none',2200)}
const log=$('log'),cur=()=>D.chats.find(c=>c.id==D.cur);let pend=null,lastA=null;
function render(m){const d=document.createElement('div');d.className='m '+m.c;d.textContent=m.t;d._m=m;d.onclick=()=>{if(d.classList.contains('sel')){d.remove();const c=cur(),i=c.msgs.indexOf(m);if(i>-1)c.msgs.splice(i,1);save()}else{log.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');toast('Silmek için tekrar dokun')}};log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function say(t,c){const m={c,t};cur().msgs.push(m);save();return render(m)}
function bot(t){const d=say('…','b');setTimeout(()=>{d._m.t=t;d.textContent=t;save();log.scrollTop=log.scrollHeight},350+Math.random()*300)}
function mk(){const c={id:Date.now(),title:'Yeni sohbet',msgs:[]};D.chats.unshift(c);D.cur=c.id}
function load(){log.innerHTML='';pend=null;const c=cur();c.msgs.forEach(render);if(!c.msgs.length)say(MO[D.mood].hi,'b')}
function newChat(){if(D.chats.length>=12){toast('En fazla 12 sohbet açabilirsin. Birini silmelisin.');return}mk();save();load();lst();$('dr').classList.remove('o')}
function delChat(id){D.chats=D.chats.filter(c=>c.id!=id);if(!D.chats.length)mk();if(!cur())D.cur=D.chats[0].id;save();load();lst()}
function lst(){const l=$('cl');l.innerHTML='';$('cc').textContent=D.chats.length;D.chats.forEach(c=>{const r=document.createElement('div');r.className='r'+(c.id==D.cur?' cur':'');const t=document.createElement('p');t.textContent=c.title;const s=document.createElement('span');s.className='l';s.textContent=c.msgs.length+' mesaj';r.append(t,s);r.onclick=()=>{D.cur=c.id;save();load();$('dr').classList.remove('o')};const x=document.createElement('button');x.className='sb';x.textContent='Sil';x.onclick=e=>{e.stopPropagation();delChat(c.id)};r.appendChild(x);l.appendChild(r)})}
function chips(){const m=$('mo');m.innerHTML='';Object.entries(MO).forEach(([k,v])=>{const b=document.createElement('button');b.className='chip'+(k==D.mood?' on':'');b.textContent=v.e+' '+v.n;b.onclick=()=>{D.mood=k;save();chips();bot(MO[k].hi)};m.appendChild(b)});$('av').textContent=MO[D.mood].e;$('ms').textContent=D.name+' • '+MO[D.mood].n+' modu'}
function send(){const v=$('in').value.trim();if(!v)return;$('in').value='';
const q=v.match(/^(?:öğret|ogret)\s*:\s*(.+?)\s*=\s*(.+)$/i);if(q){const sp=s=>s.split('|').map(x=>x.trim()).filter(Boolean);addRule(sp(q[1]),sp(q[2]));save();rend();return toast('Öğretildi: '+q[1])}
say(v,'u');const c=cur();if(c.title=='Yeni sohbet'){c.title=v.slice(0,26);save()}
if(pend){if(tr(v)=='iptal'){pend=null;return bot('Tamam, vazgeçtim.')}addRule([pend],[v]);pend=null;save();rend();return bot(mood(fill(v)))}
for(const [re,rs] of EMO)if(re.test(v))return bot(mood(pick(rs)));
const kp=find(v,KP);if(kp){const sf=["friend","sad","love"].includes(D.mood);return bot(mood(fill(pick(sf?SOFT:kp))))}
let pool=null;if(D.mood=="angry")pool=find(v,AP);else if(D.mood=="love")pool=find(v,LP);if(!pool)pool=find(v);if(pool){let p=pool.filter(x=>x!==lastA);if(!p.length)p=pool;lastA=pick(p);return bot(mood(fill(lastA)))}
const fb=mood(pick(MO[D.mood].fb));if(D.learn){pend=v;bot(fb+'\n“'+v+'” yazılınca ne cevap vereyim? Bir sonraki mesajına yaz (vazgeçmek için “iptal”).')}else bot(fb)}
$('sd').onclick=send;$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}});
let ed=null;const L=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
function rend(){$('cn2').textContent=D.rules.length;const l=$('rl');l.innerHTML='';
D.rules.forEach(r=>{const d=document.createElement('div');d.className='r';[['Yazınca: ',r.t],['Cevap: ',r.r]].forEach(([a,b])=>{const p=document.createElement('p');p.innerHTML='<span class="l">'+a+'</span>';p.appendChild(document.createTextNode(b.join(' • ')));d.appendChild(p)});
const e=document.createElement('button');e.className='sb';e.textContent='Düzenle';e.onclick=()=>{ed=r.id;$('tt').value=r.t.join('\n');$('rr').value=r.r.join('\n');$('ad').textContent='Kaydet';$('cn').style.display='inline-block';$('tt').scrollIntoView({block:'center'})};
const x=document.createElement('button');x.className='sb';x.textContent='Sil';x.onclick=()=>{D.rules=D.rules.filter(q=>q.id!=r.id);save();rend()};d.append(e,x);l.appendChild(d)});
$('vr').textContent='Sürüm 12 • '+D.rules.length+' kural • '+Object.keys(MO).length+' mod (üstte romantik 💕 dahil)';$('bn').value=D.name;$('un').value=D.user;$('lr').checked=D.learn;$('ms').textContent=D.name+' • '+MO[D.mood].n+' modu'}
function clr(){ed=null;$('tt').value=$('rr').value='';$('ad').textContent='Ekle';$('cn').style.display='none'}
$('ad').onclick=()=>{const t=L($('tt').value),r=L($('rr').value);if(!t.length||!r.length)return toast('İfadeyi de cevabı da yaz.');if(ed){const q=D.rules.find(z=>z.id==ed);q.t=t;q.r=r}else addRule(t,r);save();clr();rend()};$('cn').onclick=clr;
['bn','un'].forEach(i=>$(i).oninput=()=>{D.name=$('bn').value||'Mini';D.user=$('un').value||'dostum';save();$('ms').textContent=D.name+' • '+MO[D.mood].n+' modu'});
$('lr').onchange=()=>{D.learn=$('lr').checked;save()};
const TN={auto:'Otomatik',light:'Aydınlık',dark:'Karanlık',eye:'Göz koruyucu'};
function applyTh(){const t=D.theme||'auto',r=document.documentElement;if(t=='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);$('th').value=t;$('tm').textContent={auto:'🌗',light:'☀️',dark:'🌙',eye:'📖'}[t]}
